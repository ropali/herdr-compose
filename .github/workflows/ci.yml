name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project and dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run unit test suite
        run: uv run pytest -v

      - name: Validate example layout files
        run: |
          uv run herdr-compose validate examples/complex_multi_workspace.yaml
          uv run herdr-compose validate examples/full_workspace.yaml
          uv run herdr-compose validate examples/multi_tab_layout.yaml
